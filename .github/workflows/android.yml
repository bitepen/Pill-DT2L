name: Android CI Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK 37
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;35.0.0"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: echo "${{secrets.SIGNING_KEY}}" | base64 -d > app/release.jks

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        STORE_PASSWORD: ${{secrets.KEY_STORE_PASSWORD}}
        KEY_ALIAS: "my-alias"
        KEY_PASSWORD: ${{secrets.KEY_PASSWORD}}

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Pill-DT2L-Release-Signed
        path: app/build/outputs/apk/release/*.apk